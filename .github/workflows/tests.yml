name: tests
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Parser matches the samples' ground truth
        run: python tools/check_samples.py
      - name: Parser and verifier match the locked snapshots
        run: python run_regression.py
